name: Warlords · CI

# The Mac mini's auto-update (warlords/deploy/home-host.sh) updates only to a commit this workflow
# passed: it asks GitHub for the runs of `warlords-ci.yml` by name — keep the file name.

on:
  pull_request:
    paths: ['warlords/**', '.github/workflows/warlords-*.yml']
  push:
    branches: [main]
    paths: ['warlords/**', '.github/workflows/warlords-*.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warlords
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: warlords/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      # the server-run room worker the Mac mini builds (deploy/install.sh): built first, so the
      # unit tests that start it for real (tests/unit/server/rooms.test.ts) run too
      - run: npm run build:headless
      - run: npm test
      - run: npm run build
      - run: npm run build:single

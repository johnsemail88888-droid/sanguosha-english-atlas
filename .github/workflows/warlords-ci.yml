name: Warlords · CI

on:
  pull_request:
    paths: ['warlords/**', '.github/workflows/warlords-*.yml']
  push:
    branches: [main]
    paths: ['warlords/**', '.github/workflows/warlords-*.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warlords
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: warlords/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:single

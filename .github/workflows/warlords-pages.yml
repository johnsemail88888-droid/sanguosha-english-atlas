name: Warlords · Deploy web version

# Publishes the game to GitHub Pages under /warlords/ on the existing gh-pages branch.
# With destination_dir set, only /warlords/ is replaced on each deploy (the atlas site
# elsewhere on the branch is untouched), so removed art doesn't pile up. The previous
# deploys' hashed bundles (assets/*-<hash>.js|css) are carried over for 7 days: a tab
# opened before a deploy still lazy-loads the chunks of its own build.
# A push that only edits the art manifest is skipped here: the assets workflow fetches
# the art, commits it and then starts this workflow itself.
on:
  push:
    branches: [main]
    paths: ['warlords/**', '!warlords/assets-src/**', '.github/workflows/warlords-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warlords-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warlords
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: warlords/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - name: Add the single-file offline build
        run: cp dist-single/index.html dist/sanguo-warlords-offline.html
      # keep_files: false replaces /warlords/ on every deploy — also the hashed bundles a page opened
      # before this deploy still lazy-imports (the match scene…). Carry the previous deploy's bundles
      # over for a week (scripts/keep-old-assets.mjs; only assets/*, not the art under assets/<dir>/).
      - name: Keep the previous deploy's bundles for pages still open
        continue-on-error: true
        run: |
          rm -rf ../prev-pages
          git clone -q --depth 1 --branch gh-pages --filter=blob:none --sparse "https://github.com/${{ github.repository }}.git" ../prev-pages
          git -C ../prev-pages sparse-checkout set --no-cone '/warlords/assets/*' '!/warlords/assets/*/'
          node scripts/keep-old-assets.mjs ../prev-pages/warlords dist --days=7
          rm -rf ../prev-pages
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./warlords/dist
          destination_dir: warlords
          keep_files: false
          commit_message: 'deploy(warlords): ${{ github.sha }}'

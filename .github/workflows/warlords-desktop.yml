name: Warlords · Desktop builds

# Every push to main that changes the game app builds the Windows / macOS / Linux apps and
# publishes them as the newest GitHub release (tag warlords-build-<run>, version 0.1.<run>, with
# electron-updater's latest*.yml + .blockmap files next to the installers). Installed apps pick it
# up by themselves (warlords/electron/updater.cjs): the Windows setup build and the Linux AppImage
# download it in the background and install it on quit; the portable exe and the Mac app offer
# 「有新版本 build N · 下载」 on the title screen. Docs / tests-only pushes do not release.
# Only main publishes. A manual run of another branch (or with `publish` off) is a dry run: the
# apps and the release notes become the run's artifacts, no release — installed apps never see it.
on:
  push:
    branches: [main]
    paths:
      - 'warlords/src/**'
      - 'warlords/electron/**'
      - 'warlords/public/**'
      - 'warlords/server/**'
      - 'warlords/build-res/**'
      - 'warlords/index.html'
      - 'warlords/package.json'
      - 'warlords/package-lock.json'
      - 'warlords/vite.config.ts'
      - 'warlords/vite.headless.config.ts'
      - 'warlords/scripts/compat-id.mjs'
      - 'warlords/scripts/release-notes.mjs'
      - '.github/workflows/warlords-desktop.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release (main only — another branch is always a dry run; off: only build)'
        type: boolean
        default: true

permissions:
  contents: write

# One release build at a time; a newer push cancels an older one still running (a draft it left
# behind is deleted by the next release). Dry runs queue per branch and never cancel a release.
# A re-run (attempt 2+) of an older run never cancels a newer release: it waits, then its publish
# step sees the newer build and stands down.
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish)) && 'warlords-desktop-release' || format('warlords-desktop-dry-{0}', github.ref) }}
  cancel-in-progress: ${{ github.run_attempt == '1' }}

env:
  # strictly increasing, so electron-updater sees every build as newer; the tag names its release
  APP_VERSION: 0.1.${{ github.run_number }}
  RELEASE_TAG: warlords-build-${{ github.run_number }}
  # main only: a manual run of any other branch is a dry run even with `publish` on (every setup
  # build / AppImage would otherwise install unmerged code)
  PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win portable nsis --x64
            feed: latest.yml
          - os: macos-latest
            target: --mac dmg --arm64 --x64
            feed: latest-mac.yml
          - os: ubuntu-latest
            target: --linux AppImage --x64
            feed: latest-linux.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: warlords
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: warlords/package-lock.json
      - run: npm ci
      # the shipped game: online play on the official server (src/net/official.ts) — never
      # VITE_OFFICIAL_RELAY='' here, that is for tests and CI checks only
      - run: npm run build
      - name: Package ${{ env.APP_VERSION }}
        run: npx electron-builder ${{ matrix.target }} --publish never --config.extraMetadata.version="$APP_VERSION"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # electron-updater reads <feed>/latest*.yml: it must be there and say this version
      - name: Update metadata (${{ matrix.feed }})
        run: |
          ls -la release
          cat "release/${{ matrix.feed }}"
          grep -Eq "^version: '?${APP_VERSION}'?\$" "release/${{ matrix.feed }}"
      # macOS: the apps are ad-hoc signed (package.json build.mac.identity '-'): an unsigned
      # (or broken-signature) arm64 app downloaded from the web is 「已损坏，无法打开」
      - name: macOS signature check
        if: runner.os == 'macOS'
        run: |
          for APP in release/mac*/SanguoWarlords.app; do
            echo "== $APP"
            codesign -dv --verbose=2 "$APP" 2>&1 | tee sign.log
            grep -q 'Signature=adhoc' sign.log
            codesign --verify --deep --strict --verbose=2 "$APP"
            spctl -a -vv -t exec "$APP" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: warlords-${{ matrix.os }}
          if-no-files-found: error
          compression-level: 0
          path: |
            warlords/release/*.exe
            warlords/release/*.dmg
            warlords/release/*.AppImage
            warlords/release/latest*.yml
            warlords/release/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # all history and tags: the notes list the commits since the previous warlords-build tag
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: warlords-*
          merge-multiple: true
      - name: Check what electron-updater will download
        run: |
          ls -la out
          for f in latest.yml latest-linux.yml latest-mac.yml; do
            grep -Eq "^version: '?${APP_VERSION}'?\$" "out/$f" || { echo "::error::out/$f is missing or not version $APP_VERSION"; exit 1; }
          done
          # every file the metadata names is part of the release (the feed is releases/latest/download/<url>)
          for url in $(sed -nE "s/^[[:space:]]*(- )?url:[[:space:]]*'?([^' ]+)'?[[:space:]]*\$/\2/p" out/latest*.yml | sort -u); do
            [ -f "out/$url" ] || { echo "::error::$url is in the update metadata but was not built"; exit 1; }
          done
          ls out/*-Windows-setup.exe.blockmap
      # the same installers again under names without the version: a link like
      # releases/latest/download/SanguoWarlords-Windows-setup.exe always gives the newest build
      # (the updater keeps using the versioned names from latest*.yml: differential downloads need them)
      - name: Stable download names
        run: |
          set -euo pipefail
          cd out
          for f in SanguoWarlords-"$APP_VERSION"-*; do
            case "$f" in *.blockmap) continue ;; esac
            cp "$f" "SanguoWarlords-${f#SanguoWarlords-"$APP_VERSION"-}"
          done
          ls -la
      - name: Release notes
        run: |
          node warlords/scripts/release-notes.mjs --build "${{ github.run_number }}" --ref "$GITHUB_SHA" --version "$APP_VERSION" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH" != true ]; then echo "::notice::dry run of ${GITHUB_REF}: nothing is published (only main publishes; the apps are this run's artifacts)"; fi
      - name: Keep the notes (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
      # a draft while the files upload (players' apps only see a complete release), then the latest
      # release — the in-game 「下载桌面版」 links and the update feed both follow releases/latest
      - name: Publish ${{ env.RELEASE_TAG }}
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # (belt and braces: PUBLISH is false off main)
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::only main publishes ($GITHUB_REF)"; exit 1; }
          # drafts left behind by a cancelled or failed release run
          gh release list --limit 100 --json tagName,isDraft -q '.[] | select(.isDraft) | .tagName' \
            | { grep -E '^warlords-build-[0-9]+$' || true; } \
            | while read -r t; do echo "deleting the stale draft $t"; gh release delete "$t" --yes || true; done
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            echo "$RELEASE_TAG is already published (a re-run): nothing to do"
            exit 0
          fi
          # a re-run of an older (cancelled / failed) run keeps its old run number and commit: never
          # publish it over a newer build (it would become "latest" — players would get old code)
          NEWEST=$(gh release list --limit 100 --json tagName,isDraft -q '.[] | select(.isDraft | not) | .tagName' \
            | sed -nE 's/^warlords-build-([0-9]+)$/\1/p' | sort -n | tail -n 1)
          if [ -n "$NEWEST" ] && [ "$NEWEST" -gt "$GITHUB_RUN_NUMBER" ]; then
            echo "::warning::warlords-build-$NEWEST is newer: not publishing build $GITHUB_RUN_NUMBER (an old run re-run)"
            exit 0
          fi
          gh release create "$RELEASE_TAG" out/* --draft --target "$GITHUB_SHA" \
            --title "三国杀·枪火乱世 build ${{ github.run_number }}" --notes-file "$RUNNER_TEMP/notes.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets -q '"\(.tagName) draft=\(.isDraft) files=\(.assets | length)"'

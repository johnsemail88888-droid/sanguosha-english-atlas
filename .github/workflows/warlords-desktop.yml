name: Warlords · Desktop builds

# Push a tag like `warlords-v0.1.0` (or run manually) to build Windows / macOS / Linux
# apps and attach them to a GitHub Release.
on:
  push:
    tags: ['warlords-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win portable nsis --x64
          - os: macos-latest
            target: --mac dmg --arm64 --x64
          - os: ubuntu-latest
            target: --linux AppImage --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: warlords
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: warlords/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # macOS: the apps are ad-hoc signed (package.json build.mac.identity '-'): an unsigned
      # (or broken-signature) arm64 app downloaded from the web is 「已损坏，无法打开」
      - name: macOS signature check
        if: runner.os == 'macOS'
        run: |
          for APP in release/mac*/SanguoWarlords.app; do
            echo "== $APP"
            codesign -dv --verbose=2 "$APP" 2>&1 | tee sign.log
            grep -q 'Signature=adhoc' sign.log
            codesign --verify --deep --strict --verbose=2 "$APP"
            spctl -a -vv -t exec "$APP" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: warlords-${{ matrix.os }}
          if-no-files-found: error
          path: |
            warlords/release/*.exe
            warlords/release/*.dmg
            warlords/release/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('warlords-build-{0}', github.run_number) }}
          # a manual run tags the commit that was built, not the default branch's head
          target_commitish: ${{ github.sha }}
          name: 三国杀·枪火乱世 ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          # every build is the newest game release: the in-game 「下载桌面版」 links open
          # releases/latest, which skips pre-releases (it showed the old atlas v1.1.1)
          prerelease: false
          make_latest: true
          files: out/*
          body: |
            ## 三国杀·枪火乱世 桌面版
            - **Windows**：下载 `*-Windows-portable.exe` 双击即玩（免安装），或 `*-setup.exe` 安装版。首次运行 Windows 防火墙会询问是否允许访问网络：勾选「专用网络」并点「允许」，否则同一 Wi-Fi 的朋友连不进你的房间。若提示「Windows 已保护你的电脑」，点「更多信息 → 仍要运行」（未签名）。
            - **macOS**：Apple 芯片（M1/M2/M3/M4…，「关于本机」里芯片写 Apple M…）下载 `*-macOS-arm64.dmg`；Intel 处理器的 Mac 下载 `*-macOS-x64.dmg`。双击 dmg，把「SanguoWarlords」拖进「应用程序」文件夹，再从“应用程序”里打开。
              应用没有 Apple 开发者签名（只有本地签名），第一次打开会提示「无法验证开发者」/「Apple 无法验证…是否包含恶意软件」：点「完成」，然后打开「系统设置 → 隐私与安全性」，在底部找到 SanguoWarlords 点「仍要打开」并输入密码（macOS 14 及更早也可以在“应用程序”里按住 Control 点击应用 → 打开 → 打开）。之后双击即可。
              如果仍提示「已损坏，无法打开」：打开“终端”，运行 `xattr -dr com.apple.quarantine "/Applications/SanguoWarlords.app"`，再打开应用。
              不想装也可以直接用 Safari / Chrome 打开网页版。
            - **Linux**：下载 `.AppImage`，`chmod +x` 后运行。
            桌面版内置局域网服务器：菜单「游戏 → 局域网联机地址」把地址发给同一 Wi-Fi 的朋友。

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#3b2414"/>
      <stop offset="0.6" stop-color="#1c110a"/>
      <stop offset="1" stop-color="#0b0705"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.45" stop-color="#e3b44a"/>
      <stop offset="1" stop-color="#8a5a18"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0402f"/>
      <stop offset="1" stop-color="#a3170f"/>
    </linearGradient>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="10"/>
    </filter>
    <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="210" fill="url(#bg)"/>
  <rect x="24" y="24" width="976" height="976" rx="210" fill="none" stroke="url(#gold)" stroke-width="18"/>
  <!-- crossed rifle-halberds -->
  <g opacity="0.95" stroke-linecap="round">
    <g transform="rotate(-38 512 512)">
      <rect x="150" y="494" width="724" height="36" rx="10" fill="#2a2a2e"/>
      <rect x="690" y="482" width="120" height="60" rx="10" fill="#3a3a40"/>
      <path d="M874 512 l70 -46 l-18 46 l18 46 z" fill="url(#gold)"/>
      <rect x="250" y="530" width="44" height="70" rx="8" fill="#2a2a2e"/>
    </g>
    <g transform="rotate(218 512 512)">
      <rect x="150" y="494" width="724" height="36" rx="10" fill="#2a2a2e"/>
      <rect x="690" y="482" width="120" height="60" rx="10" fill="#3a3a40"/>
      <path d="M874 512 l70 -46 l-18 46 l18 46 z" fill="url(#gold)"/>
      <rect x="250" y="530" width="44" height="70" rx="8" fill="#2a2a2e"/>
    </g>
  </g>
  <circle cx="512" cy="512" r="250" fill="#ff5a2a" opacity="0.35" filter="url(#glow)"/>
  <g transform="rotate(-6 512 512)" filter="url(#rough)">
    <rect x="312" y="312" width="400" height="400" rx="36" fill="url(#seal)"/>
    <rect x="338" y="338" width="348" height="348" rx="22" fill="none" stroke="#fff3e6" stroke-width="12" opacity="0.9"/>
    <text x="512" y="628" text-anchor="middle" font-family="WenQuanYi Zen Hei, sans-serif" font-weight="700" font-size="300" fill="#fff6ea">杀</text>
  </g>
  <circle cx="512" cy="512" r="330" fill="none" stroke="url(#gold)" stroke-width="10" stroke-dasharray="26 18" opacity="0.8"/>
</svg>
